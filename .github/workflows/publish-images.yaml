name: Publish Base Images

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: ~

permissions:
  contents: write
  packages: write
  security-events: write

jobs:
  publish:
    name: Build & Publish (${{ matrix.variant }} / PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [prod, ci, dev]
        php: ['8.5']
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase repository name
        id: repo
        run: echo "repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Probe upstream versions
        id: versions
        run: |
          BASE_IMAGE="dunglas/frankenphp:1.12-php${{ matrix.php }}-alpine"
          docker pull "$BASE_IMAGE" >/dev/null
          EXACT_PHP=$(docker run --rm "$BASE_IMAGE" php -r 'echo PHP_VERSION;')
          EXACT_FRANKENPHP=$(docker run --rm "$BASE_IMAGE" frankenphp version | head -n1 | tr -d '\r')
          echo "php_version=$EXACT_PHP" >> "$GITHUB_OUTPUT"
          echo "frankenphp_version=$EXACT_FRANKENPHP" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.repo_lower }}/${{ matrix.variant }}
          tags: |
            type=semver,pattern={{version}},suffix=-php${{ matrix.php }}
            type=semver,pattern={{major}}.{{minor}},suffix=-php${{ matrix.php }}
            type=semver,pattern={{major}},suffix=-php${{ matrix.php }}
            type=raw,value=php${{ matrix.php }},enable=${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ matrix.php == '8.5' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=PHP ${{ steps.versions.outputs.php_version }} / FrankenPHP (${{ matrix.variant }})
            dev.php-platform.php-version=${{ steps.versions.outputs.php_version }}
            dev.php-platform.php-minor=${{ matrix.php }}
            dev.php-platform.frankenphp-version=${{ steps.versions.outputs.frankenphp_version }}

      - name: Build & push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.variant }}/Dockerfile
          pull: true
          push: true
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish-${{ matrix.variant }}-php${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.variant }}-php${{ matrix.php }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.repo.outputs.repo_lower }}/${{ matrix.variant }}@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-${{ matrix.variant }}-php${{ matrix.php }}.sarif'

      - name: Upload Trivy scan results
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-${{ matrix.variant }}-php${{ matrix.php }}.sarif'
          category: trivy-${{ matrix.variant }}-php${{ matrix.php }}

      - name: Write build summary
        run: |
          {
            echo "| Variant | PHP Minor | Exact PHP | FrankenPHP | Digest |"
            echo "| --- | --- | --- | --- | --- |"
            echo "| \`${{ matrix.variant }}\` | \`${{ matrix.php }}\` | \`${{ steps.versions.outputs.php_version }}\` | \`${{ steps.versions.outputs.frankenphp_version }}\` | \`${{ steps.build.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  update-major-tag:
    name: Update Floating Major Tag
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move floating major tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          MAJOR_TAG="${TAG%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "$MAJOR_TAG" -m "Update floating tag $MAJOR_TAG to $TAG"
          git push origin "refs/tags/$MAJOR_TAG" --force
