<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img">
  <title>PHP Platform — Centralized PHP runtime, maintained in one place</title>
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0E1529"/>
    </linearGradient>
    <radialGradient id="glowSky" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx="85%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.45"/>
    </pattern>
    <clipPath id="outerClip">
      <rect x="1" y="1" width="1198" height="338" rx="16"/>
    </clipPath>
  </defs>

  <!-- Canvas -->
  <g clip-path="url(#outerClip)">
    <rect x="1" y="1" width="1198" height="338" rx="16" fill="url(#cardBg)"/>
    <rect x="1" y="1" width="1198" height="338" rx="16" fill="url(#dotGrid)"/>
    <rect x="1" y="1" width="1198" height="338" rx="16" fill="url(#glowSky)"/>
    <rect x="1" y="1" width="1198" height="338" rx="16" fill="url(#glowIndigo)"/>
  </g>
  <rect x="1" y="1" width="1198" height="338" rx="16" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Left Column: Eyebrow Pill -->
  <rect x="44" y="34" width="332" height="28" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <circle cx="62" cy="48" r="4" fill="#818CF8"/>
  <text x="216" y="52" text-anchor="middle" fill="#38BDF8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.1">GHCR IMAGES · WORKFLOWS · RENOVATE</text>

  <!-- Left Column: Value Headline -->
  <text x="44" y="106" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.8">Centralized PHP runtime,</text>
  <text x="44" y="150" fill="url(#headlineGrad)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.8">maintained in one place.</text>

  <!-- Left Column: 2x2 Feature Tiles -->
  <!-- Tile 1: 3 Prebuilt Variants -->
  <g>
    <rect x="44" y="182" width="272" height="58" rx="12" fill="#0F172A" fill-opacity="0.88" stroke="#1E293B" stroke-width="1"/>
    <rect x="56" y="195" width="32" height="32" rx="8" fill="#0EA5E9" fill-opacity="0.14"/>
    <path d="M72 203 L79 207 V215 L72 219 L65 215 V207 Z M65 207 L72 211 L79 207 M72 211 V219" fill="none" stroke="#38BDF8" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="98" y="207" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700">3 Prebuilt Variants</text>
    <text x="98" y="225" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500">prod · ci · dev on Alpine</text>
  </g>

  <!-- Tile 2: Reusable Workflows -->
  <g>
    <rect x="328" y="182" width="272" height="58" rx="12" fill="#0F172A" fill-opacity="0.88" stroke="#1E293B" stroke-width="1"/>
    <rect x="340" y="195" width="32" height="32" rx="8" fill="#818CF8" fill-opacity="0.15"/>
    <path d="M350 206 H362 M350 211 H362 M350 216 H358 M359 214 L362 216 L359 218" fill="none" stroke="#818CF8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="382" y="207" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700">Reusable Workflows</text>
    <text x="382" y="225" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500">quality · ci-checks · build</text>
  </g>

  <!-- Tile 3: OCI Version Labels -->
  <g>
    <rect x="44" y="250" width="272" height="58" rx="12" fill="#0F172A" fill-opacity="0.88" stroke="#1E293B" stroke-width="1"/>
    <rect x="56" y="263" width="32" height="32" rx="8" fill="#38BDF8" fill-opacity="0.14"/>
    <path d="M66 272 H73 L79 278 L73 285 L66 278 Z" fill="none" stroke="#38BDF8" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="70" cy="276" r="1.3" fill="#38BDF8"/>
    <text x="98" y="275" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700">OCI Version Labels</text>
    <text x="98" y="293" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500">Exact PHP &amp; FrankenPHP</text>
  </g>

  <!-- Tile 4: Trivy + Renovate -->
  <g>
    <rect x="328" y="250" width="272" height="58" rx="12" fill="#0F172A" fill-opacity="0.88" stroke="#1E293B" stroke-width="1"/>
    <rect x="340" y="263" width="32" height="32" rx="8" fill="#22C55E" fill-opacity="0.14"/>
    <path d="M356 271 L363 274 V279 C363 283.5 359.8 286.8 356 288 C352.2 286.8 349 283.5 349 279 V274 Z" fill="none" stroke="#22C55E" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M353.5 279.5 L355.5 281.5 L359 277.5" fill="none" stroke="#22C55E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="382" y="275" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700">Trivy + Renovate</text>
    <text x="382" y="293" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500">Scanned &amp; auto-propagated</text>
  </g>

  <!-- Right Column: Terminal Window -->
  <rect x="628" y="34" width="528" height="274" rx="14" fill="#020617" stroke="#1E293B" stroke-width="1.2"/>
  <path d="M629 48 C629 40.3 635.3 34 643 34 H1141 C1148.7 34 1155 40.3 1155 48 V70 H629 Z" fill="#0B1120"/>
  <line x1="629" y1="70" x2="1155" y2="70" stroke="#1E293B" stroke-width="1"/>
  <circle cx="650" cy="52" r="5" fill="#EF4444"/>
  <circle cx="667" cy="52" r="5" fill="#F59E0B"/>
  <circle cx="684" cy="52" r="5" fill="#22C55E"/>
  <text x="892" y="56" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600">ghcr.io/rdurica/php-platform</text>

  <!-- Terminal Body -->
  <text x="652" y="102" fill="#38BDF8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700">$</text>
  <text x="670" y="102" fill="#F8FAFC" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600">docker images --filter php-platform</text>

  <text x="652" y="130" fill="#22C55E" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700">✓</text>
  <text x="670" y="130" fill="#38BDF8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700">prod</text>
  <text x="718" y="130" fill="#94A3B8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">OPcache + JIT · hardened Caddy</text>

  <text x="652" y="155" fill="#22C55E" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700">✓</text>
  <text x="670" y="155" fill="#818CF8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700">ci</text>
  <text x="718" y="155" fill="#94A3B8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">Composer 2 · PHP extensions</text>

  <text x="652" y="180" fill="#22C55E" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700">✓</text>
  <text x="670" y="180" fill="#22C55E" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700">dev</text>
  <text x="718" y="180" fill="#94A3B8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">Xdebug 3 · Node.js · CLI tools</text>

  <text x="652" y="205" fill="#22C55E" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700">✓</text>
  <text x="670" y="205" fill="#F59E0B" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700">scan</text>
  <text x="718" y="205" fill="#94A3B8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">Trivy SARIF + OCI version labels</text>

  <line x1="652" y1="224" x2="1132" y2="224" stroke="#0F172A" stroke-width="1"/>

  <text x="652" y="252" fill="#38BDF8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700">➜</text>
  <text x="670" y="252" fill="#64748B" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">Tags:</text>
  <text x="760" y="252" fill="#38BDF8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700">&lt;semver&gt;-php&lt;minor&gt; · latest</text>

  <text x="652" y="279" fill="#818CF8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700">➜</text>
  <text x="670" y="279" fill="#64748B" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">Workflows:</text>
  <text x="760" y="279" fill="#E2E8F0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">reusable-{quality,ci,build}</text>
