name: Reusable Build Docker Image

on:
  workflow_call:
    inputs:
      dockerfile:
        description: Path to production Dockerfile
        required: false
        type: string
        default: 'build/prod/Dockerfile'
      context:
        description: Docker build context
        required: false
        type: string
        default: '.'
      registry:
        description: Target container registry
        required: false
        type: string
        default: 'ghcr.io'
      push-latest:
        description: Also tag pushed image with latest
        required: false
        type: boolean
        default: true
      trivy-scan:
        description: Scan pushed image with Trivy and upload SARIF
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        id: repo
        run: echo "image_name=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.registry }}/${{ steps.repo.outputs.image_name }}
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ inputs.push-latest }}

      - name: Build & push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        if: inputs.trivy-scan
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ inputs.registry }}/${{ steps.repo.outputs.image_name }}@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        if: ${{ always() && steps.build.outcome == 'success' && inputs.trivy-scan }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
